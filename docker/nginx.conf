server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rewritten at start-up and refreshed daily, so browsers must re-check them.
    location = /config.js          { add_header Cache-Control "no-store"; }
    location = /opportunities.json { add_header Cache-Control "no-cache"; }

    location /api/ai/ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        add_header Cache-Control "no-store" always;
    }

    # The refresh scripts live next to the site but are not part of it.
    location /scripts/ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
