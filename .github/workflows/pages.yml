name: Deploy Grant Navigator to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh funding data (grants.gov + USASpending + ProPublica + SAA)']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate application rules
        run: node --test tests/unit/*.test.cjs
      - name: Prepare public website
        run: node scripts/build-pages.mjs
        env:
          GRANT_AI_BASE_URL: ${{ vars.GRANT_AI_BASE_URL }}
      - name: Inspect Pages publishing mode
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          case "$pages_build_type" in
            workflow|legacy) ;;
            *) echo "Unsupported Pages publishing mode" >&2; exit 1 ;;
          esac
          echo "build_type=$pages_build_type" >> "$GITHUB_OUTPUT"
      - name: Record branch publishing
        if: steps.pages_mode.outputs.build_type == 'legacy'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Website validation passed. This repository uses GitHub's existing branch-based Pages publisher.
          The separate `pages-build-deployment` run publishes `main` at the configured site URL.
          Build-time AI endpoint variables apply only to Actions artifact publishing; branch publishing uses the public `config.js` in `main` or the website's manual connection setting.
          SUMMARY
      - uses: actions/configure-pages@v5
        if: steps.pages_mode.outputs.build_type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_mode.outputs.build_type == 'workflow'
        with:
          path: dist
      - name: Deploy website
        id: deployment
        if: steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4
